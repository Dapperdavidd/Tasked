[workspace]
members = [
    "crates/core",
    "crates/api",
    "crates/db",
    "crates/worker",
    "crates/ingest",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "UNLICENSED"

[workspace.dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.38", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10.0"
actix-web = "4.11.0"
proptest = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
schemars = "1.2.2"
serde_json = "1.0.145"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
sha2 = "0.10.9"
thiserror = "2.0.17"
ts-rs = "12.0.1"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.18.1", features = ["serde", "v7"] }
tracked-core = { path = "crates/core" }
tracked-db = { path = "crates/db" }
tracked-ingest = { path = "crates/ingest" }
tracked-worker = { path = "crates/worker" }
